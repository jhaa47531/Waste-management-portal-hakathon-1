<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waste Pickup Request Portal</title>
    <meta name="description" content="Secure municipal waste reporting, verification, cleaner dispatch, and photo audit system with 4 distinct roles." />
    <meta property="og:title" content="Waste Pickup Request Portal" />
    <meta property="og:description" content="Secure municipal waste reporting, verification, cleaner dispatch, and photo audit system with 4 distinct roles." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('civicpickup_theme_dark_default');
          if (!initialized) {
            localStorage.setItem('civicpickup_theme_dark_default', 'true');
            localStorage.setItem('civicpickup_theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            var stored = localStorage.getItem('civicpickup_theme');
            if (stored === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
