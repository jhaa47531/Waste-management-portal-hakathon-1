<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicPickup — Waste Pickup Request Portal</title>
    <meta name="description" content="Secure municipal waste reporting, verification, cleaner dispatch, and photo audit system with 4 distinct roles." />
    <meta property="og:title" content="CivicPickup — Waste Pickup Request Portal" />
    <meta property="og:description" content="Secure municipal waste reporting, verification, cleaner dispatch, and photo audit system with 4 distinct roles." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('civicpickup_theme');
          // Default to light mode for first-time visitors
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
